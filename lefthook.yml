glob_matcher: doublestar
pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '**/*.{js,mjs,cjs,ts,mts,cts,tsx}'
      run: ./node_modules/.bin/eslint -- {staged_files}
    typecheck:
      run: npm run typecheck
    python-lint:
      glob: '**/*.py'
      run: ruff check -- {staged_files}
    python-format:
      glob: '**/*.py'
      run: ruff format --check -- {staged_files}
    prettier:
      glob: '**/*.{js,mjs,json,md,yml}'
      run: ./node_modules/.bin/prettier --check -- {staged_files}

# Exact commit metadata checks, alongside existing checks.
commit-msg:
  commands:
    credit-message:
      run: python3 "$(git rev-parse --git-path credit-guard/entry.py)" commit-msg {1}
pre-push:
  commands:
    credit-objects:
      use_stdin: true
      run: python3 "$(git rev-parse --git-path credit-guard/entry.py)" pre-push
